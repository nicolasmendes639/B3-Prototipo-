  <style>
:root {
  --b3: #06377b;
  --b3-700: #042a5f;
  --b3-50: #eef3fb;
  --b3-100: #dbe6f6;
  --teal: #0e7c86;
  --ink: #14213d;
  --ink-2: #44526b;
  --muted: #6b7890;
  --line: #e3e8f0;
  --bg: #f4f6fa;
  --card: #ffffff;
  --pos: #137a43;
  --neg: #b3261e;
  --warn: #9a5b00;
  --warn-bg: #fff6e5;
  --ok-bg: #e9f6ef;
  --neg-bg: #fdeceb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 32, 64, .06), 0 2px 8px rgba(16, 32, 64, .04);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --c1: #06377b; --c2: #0e7c86; --c3: #7a3db8; --c4: #c27c0e; --c5: #2e8b57; --c6: #c2410c; --c7: #4f6d9a; --c8: #9b2c5e;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--b3); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
:focus-visible { outline: 3px solid #5b9cff; outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pos { color: var(--pos); font-weight: 600; white-space: nowrap; }
.neg { color: var(--neg); font-weight: 600; white-space: nowrap; }
.neu { color: var(--muted); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* ---------- Faixa do protótipo ---------- */
.proto { background: #fff4d6; color: #6b4a00; font-size: 12px; text-align: center; padding: 5px 16px; border-bottom: 1px solid #f1dfae; }

/* ---------- Topo ---------- */
.top { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 10px 20px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--b3); min-width: 0; }
.brand img { width: 40px; height: 40px; }
.brand span { font-weight: 700; font-size: 15px; white-space: nowrap; border-left: 1px solid var(--line); padding-left: 10px; }
.menu-btn { display: none; background: none; border: 0; padding: 6px; cursor: pointer; border-radius: 8px; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: 12px; }
.search input { width: 100%; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 0 16px 0 40px; font: inherit; color: var(--ink); }
.search input:focus { background: #fff; border-color: var(--b3); outline: none; box-shadow: 0 0 0 3px var(--b3-100); }
.search svg { position: absolute; left: 14px; top: 12px; color: var(--muted); }
.sugg { position: absolute; top: 46px; left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(16, 32, 64, .12); overflow: hidden; display: none; z-index: 40; }
.sugg.open { display: block; }
.sugg a { display: flex; gap: 10px; align-items: center; padding: 10px 14px; text-decoration: none; color: var(--ink); }
.sugg a[aria-selected="true"], .sugg a:hover { background: var(--b3-50); }
.sugg .tk { font-weight: 700; min-width: 64px; }
.sugg .hint { padding: 8px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: #c9d3e3; background: #fafbfd; }
.btn.primary { background: var(--b3); border-color: var(--b3); color: #fff; }
.btn.primary:hover { background: var(--b3-700); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--b3-50); border-color: var(--b3-100); color: var(--b3); }
.sel { height: 36px; border-radius: 999px; border: 1px solid var(--line); padding: 0 12px; font: inherit; background: #fff; color: var(--ink); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--b3); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 92px); }
.nav { background: #fff; border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.nav h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 10px 6px; font-weight: 650; }
.nav h4:first-child { margin-top: 0; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-weight: 520; }
.nav a:hover { background: var(--bg); color: var(--ink); }
.nav a.active { background: var(--b3-50); color: var(--b3); font-weight: 650; }
.nav a svg { flex: none; opacity: .8; }
.nav .badge { margin-left: auto; }
main { padding: 24px 28px 48px; max-width: 1280px; width: 100%; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.crumb a { color: var(--muted); }

/* ---------- Cards e grids ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card-f { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kpi .lbl { color: var(--ink-2); font-size: 13px; font-weight: 550; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 24px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .det { font-size: 12px; color: var(--muted); }
.section { margin-top: 24px; }
.section > h2 { margin-bottom: 12px; }
.stack > * + * { margin-top: 10px; }

.info { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #b8c4d6; background: #fff; color: var(--muted); font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif; cursor: pointer; padding: 0; line-height: 16px; flex: none; }
.info:hover { border-color: var(--b3); color: var(--b3); }
.pop { position: absolute; z-index: 60; max-width: 320px; background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--pos); border-color: #c7e8d5; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: #f3dcae; }
.chip.err { background: var(--neg-bg); color: var(--neg); border-color: #f4c9c5; }
.chip.blue { background: var(--b3-50); color: var(--b3); border-color: var(--b3-100); }
.chip.dash { background: #fff; border-style: dashed; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--neg); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--b3); border-color: var(--b3); }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 550; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--b3); box-shadow: var(--shadow); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.filters select, .filters input { height: 34px; border-radius: 8px; border: 1px solid var(--line); padding: 0 10px; font: inherit; background: #fff; min-width: 140px; color: var(--ink); }

/* ---------- Tabelas ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.num { text-align: right; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #fafbfd; }
td a.tk, .tk-link { font-weight: 700; text-decoration: none; color: var(--b3); }
td a.tk:hover { text-decoration: underline; }
.asset { display: flex; flex-direction: column; }
.asset small { color: var(--muted); font-size: 12px; }
tfoot td { font-weight: 700; border-top: 1px solid var(--line); }
details.tbl summary { cursor: pointer; color: var(--b3); font-size: 12px; font-weight: 600; margin-top: 8px; }

/* ---------- Gráficos ---------- */
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: #edf0f5; }
.chart .axis, svg .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .cursor { stroke: #9aa7bd; stroke-dasharray: 3 3; }
.donut-n { font-size: 18px; font-weight: 700; fill: var(--ink); font-family: var(--font); }
.tip { position: absolute; display: none; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 150px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
.tip i, .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { width: 14px; height: 4px; }
.donut-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut-leg { flex: 1; min-width: 180px; }
.donut-leg .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.donut-leg .row:last-child { border-bottom: 0; }
.donut-leg .row b { margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--b3); border-radius: 99px; }

/* ---------- Listas ---------- */
.list-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; padding-bottom: 0; }
.list-item:first-child { padding-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .t { font-weight: 600; }
.list-item .s { font-size: 12px; color: var(--muted); }
.date-box { width: 46px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; background: #fff; }
.date-box b { display: block; font-size: 16px; line-height: 1.1; }
.date-box span { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.alert { display: flex; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); border: 1px solid #f3dcae; }
.alert.info-a { background: var(--b3-50); border-color: var(--b3-100); }
.alert.ok { background: var(--ok-bg); border-color: #c7e8d5; }
.alert .ic { font-size: 18px; line-height: 1; }
.alert p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }

/* ---------- Ticker do mercado ---------- */
.ix-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.ix { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.ix .n { font-size: 12px; color: var(--muted); font-weight: 600; }
.ix .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stamp { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.stamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #c27c0e; }
.stamp.closed::before { background: #9aa7bd; }

/* ---------- Ficha do ativo ---------- */
.asset-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.asset-head .tkr { font-size: 28px; font-weight: 800; color: var(--b3); letter-spacing: -.01em; }
.asset-head .price { font-size: 32px; font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.ind-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ind { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
.ind:nth-child(4n) { border-right: 0; }
.ind .l { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.ind .v { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.star { background: none; border: 1px solid var(--line); border-radius: 999px; height: 36px; padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.star[aria-pressed="true"] { background: #fff7e0; border-color: #f0d48a; color: #8a6100; }

/* ---------- Feed ---------- */
.feed { display: grid; gap: 14px; }
.feed-card { display: grid; grid-template-columns: 6px 1fr; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.feed-card .rail { background: var(--b3); }
.feed-card .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.feed-card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.feed-card .src { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
.feed-card h3 { font-size: 15.5px; }
.feed-card p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.feed-card .why { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.feed-card .acts { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.feed-end { text-align: center; color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); }
.profile-card { background: linear-gradient(135deg, var(--b3) 0%, #0b4fa8 100%); color: #fff; border: 0; }
.profile-card .muted, .profile-card p { color: #d6e3f7; }
.profile-card .btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .3); color: #fff; }
.profile-card .btn:hover { background: rgba(255, 255, 255, .2); }
.gauge { display: flex; gap: 4px; margin: 10px 0; }
.gauge span { flex: 1; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .2); }
.gauge span.on { background: #fff; }

/* ---------- Questionário ---------- */
.quiz { max-width: 720px; }
.progress { height: 6px; background: var(--b3-100); border-radius: 99px; overflow: hidden; margin: 8px 0 20px; }
.progress i { display: block; height: 100%; background: var(--b3); transition: width .25s; }
.opt { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer; background: #fff; }
.opt:hover { border-color: #b8c7e0; }
.opt:has(input:checked) { border-color: var(--b3); background: var(--b3-50); }
.opt input { accent-color: var(--b3); width: 18px; height: 18px; }
.quiz-nav { display: flex; justify-content: space-between; margin-top: 18px; }

/* ---------- Stepper ---------- */
.steps { display: flex; gap: 0; margin: 10px 0; }
.steps .st { flex: 1; text-align: center; font-size: 12px; color: var(--muted); position: relative; padding-top: 22px; }
.steps .st::before { content: ""; position: absolute; top: 6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; border: 2px solid #c3cddd; z-index: 1; }
.steps .st::after { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: #c3cddd; }
.steps .st:first-child::after { display: none; }
.steps .st.done::before { background: var(--pos); border-color: var(--pos); }
.steps .st.done::after, .steps .st.now::after { background: var(--pos); }
.steps .st.now::before { border-color: var(--b3); background: var(--b3); box-shadow: 0 0 0 4px var(--b3-100); }
.steps .st.now { color: var(--ink); font-weight: 600; }

.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.empty .big { font-size: 32px; }

/* ---------- Ocultar valores ---------- */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; transition: .2s; z-index: 80; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Responsivo ---------- */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ix-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ind-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ind:nth-child(4n) { border-right: 1px solid var(--line); }
  .ind:nth-child(2n) { border-right: 0; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; left: 0; top: 0; bottom: 0; height: 100vh; width: 270px; z-index: 50; transform: translateX(-100%); transition: transform .2s; box-shadow: 10px 0 30px rgba(0, 0, 0, .1); }
  body.nav-open .nav { transform: none; }
  .menu-btn { display: inline-grid; }
  .g2, .g3, .g-main { grid-template-columns: 1fr; }
  .brand span { display: none; }
  .top-actions .hide-sm { display: none; }
  main { padding: 18px 16px 40px; }
}
@media (max-width: 560px) {
  .top { gap: 8px; padding: 10px 12px; }
  .g4 { grid-template-columns: 1fr; }
  .ix-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search { margin-left: 0; }
  .asset-head .price { text-align: left; }
  h1 { font-size: 21px; }
}

/* ======================= Onboarding ======================= */
body.onb-mode .shell { grid-template-columns: 1fr; }
body.onb-mode .nav, body.onb-mode .menu-btn { display: none; }
body.onb-mode main { max-width: none; padding: 32px 20px 48px; }
.onb { min-height: calc(100vh - 180px); display: grid; place-items: center; }
.onb-card { width: 100%; max-width: 980px; background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 20px 60px rgba(6, 55, 123, .10); padding: 28px 32px; }
.onb-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.onb-dots { display: flex; gap: 6px; }
.onb-dots button { width: 28px; height: 6px; border-radius: 99px; border: 0; background: var(--b3-100); cursor: pointer; padding: 0; transition: .2s; }
.onb-dots button.done { background: #8fb0dd; }
.onb-dots button.on { background: var(--b3); width: 44px; }
.onb-body { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; margin: 28px 0 24px; min-height: 340px; }
.onb-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--teal); font-weight: 700; margin-bottom: 8px; }
.onb h1 { font-size: 32px; letter-spacing: -.02em; line-height: 1.15; }
.onb-text { font-size: 16px; color: var(--ink-2); margin: 12px 0 16px; line-height: 1.55; }
.onb-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.onb-list li { padding-left: 28px; position: relative; color: var(--ink); }
.onb-list li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ok-bg); color: var(--pos); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.onb-nav { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; gap: 10px; }
.onb-art { background: linear-gradient(160deg, var(--b3-50), #f7fbff); border-radius: 16px; padding: 28px; min-height: 300px; display: grid; place-items: center; }
.onb-final { text-align: center; }
.onb-final .onb-dots { justify-content: center; margin-bottom: 28px; }
.onb-final .onb-text { max-width: 560px; margin-left: auto; margin-right: auto; }
.onb-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 24px 0 28px; }
.onb-choice { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; text-align: center; transition: .15s; }
.onb-choice:hover { border-color: var(--b3); transform: translateY(-2px); box-shadow: var(--shadow); }
.onb-choice.rec { border-color: var(--b3); background: var(--b3-50); }
.onb-choice .ic { font-size: 30px; }
.onb-choice b { font-size: 15px; }
.onb-choice small { color: var(--muted); }
/* mini ilustrações */
.mk { width: 100%; max-width: 360px; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(6, 55, 123, .12); padding: 16px; display: grid; gap: 10px; }
.mk-hero { place-items: center; text-align: center; padding: 28px; }
.mk-hero img { width: 88px; height: 88px; }
.mk-lines { display: grid; gap: 8px; width: 100%; justify-items: center; }
.mk-lines i { display: block; height: 10px; border-radius: 99px; background: var(--b3-100); }
.mk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.mk-row b { height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.mk-kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
.mk-kpi span { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.mk-kpi em { font-family: Georgia, serif; font-size: 9px; border: 1px solid #b8c4d6; border-radius: 50%; width: 13px; height: 13px; display: inline-grid; place-items: center; }
.mk-kpi strong { font-size: 15px; }
.mk-chart { width: 100%; height: 90px; }
.mk-cap { font-size: 12px; color: var(--muted); text-align: center; }
.mk-ev { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.mk-ev:last-child { border-bottom: 0; }
.mk-ev > div:nth-child(2) { flex: 1; display: grid; }
.mk-ev small { color: var(--muted); font-size: 12px; }
.mk-search { border: 1.5px solid var(--b3); border-radius: 99px; padding: 10px 14px; font-size: 14px; box-shadow: 0 0 0 3px var(--b3-100); }
.caret { display: inline-block; width: 1.5px; height: 15px; background: var(--ink); vertical-align: middle; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.mk-sugg { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mk-sugg div { padding: 9px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.mk-sugg div.on { background: var(--b3-50); }
.mk-sugg b { min-width: 52px; }
.mk-sugg .chip { margin-left: auto; }
.mk-feed { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; justify-items: start; }
.mk-feed small { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--c); }
.mk-priv { gap: 12px; }
.mk-toggle { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; }
.mk-toggle i { width: 36px; height: 20px; border-radius: 99px; background: #cfd8e6; position: relative; }
.mk-toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
.mk-toggle i.on { background: var(--b3); }
.mk-toggle i.on::after { left: 18px; }
.mk-toggle em { font-style: normal; font-size: 12px; color: var(--neg); font-weight: 600; }

/* ======================= Tour guiado ======================= */
.tour-layer { position: fixed; inset: 0; z-index: 90; background: transparent; }
.tour-hl { position: fixed; z-index: 91; border-radius: 12px; box-shadow: 0 0 0 4px rgba(91, 156, 255, .9), 0 0 0 9999px rgba(10, 22, 45, .58); pointer-events: none; transition: all .25s ease; display: none; }
.tour-pop { position: fixed; z-index: 92; width: 340px; max-width: calc(100vw - 24px); background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); transition: top .25s ease, left .25s ease; }
.tour-pop.sheet { left: 12px !important; right: 12px; bottom: 12px; top: auto !important; width: auto; }
.tour-pop h3 { font-size: 16px; margin: 8px 0 4px; }
.tour-pop p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.tour-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-count { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.tour-x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px; border-radius: 6px; }
.tour-dots { display: flex; gap: 4px; margin-top: 8px; }
.tour-dots i { flex: 1; height: 4px; border-radius: 99px; background: var(--b3-100); }
.tour-dots i.on { background: var(--b3); }
.tour-nav { display: flex; justify-content: space-between; margin-top: 14px; }

/* ======================= Tutoriais ======================= */
.tut-progress { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tut-h { display: flex; gap: 12px; align-items: flex-start; }
.tut-h .grow { flex: 1; min-width: 0; }
.tut-h h2 { margin-top: 2px; }
.tut-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--b3-50); display: grid; place-items: center; font-size: 22px; flex: none; }
.tut-steps { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.tut-steps summary { cursor: pointer; color: var(--b3); font-weight: 600; font-size: 13px; }
.tut-steps ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 10px; font-size: 13px; }
.tut-steps ol span { color: var(--ink-2); }
.faq details { border-bottom: 1px solid var(--line); padding: 12px 0; }
.faq details:last-child { border-bottom: 0; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::after { content: "+"; color: var(--b3); font-size: 18px; line-height: 1; }
.faq details[open] summary::after { content: "–"; }
.faq summary::-webkit-details-marker { display: none; }
.faq p { margin: 8px 0 0; color: var(--ink-2); }
.help-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--b3); text-decoration: none; background: #fff; }
.help-btn:hover { background: var(--b3-50); }

@media (max-width: 900px) {
  .onb-body { grid-template-columns: 1fr; gap: 20px; margin: 18px 0; min-height: 0; }
  .onb-art { min-height: 0; padding: 18px; order: -1; }
  .onb-choices { grid-template-columns: 1fr; }
  .onb-card { padding: 20px 18px; border-radius: 16px; }
  .onb h1 { font-size: 25px; }
  .onb-text { font-size: 15px; }
}

</style>

  <script>/* js/util.js */
/* Utilitários de formatação, estado e DOM. */
window.U = (function () {
  const nfBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  const state = {
    get hide() { return store.get("hide", false); },
    set hide(v) { store.set("hide", v); },
  };

  const store = {
    get(k, def) { try { const v = localStorage.getItem("b3i:" + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem("b3i:" + k, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } },
  };

  const MASK = "R$ ••••••";
  const brl = (v, force) => (state.hide && !force ? MASK : nfBRL.format(v || 0));
  const num = (v, d = 2) => (v === null || v === undefined || isNaN(v) ? "—" : d === 0 ? nf0.format(v) : new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v));
  const qtd = (v) => (state.hide ? "•••" : Number.isInteger(v) ? nf0.format(v) : num(v, 2));
  const pct = (v, d = 2) => (v === null || v === undefined || isNaN(v) ? "—" : nf2.format(+v.toFixed(d)).replace(/,00$/, ",00") + "%");
  const sinal = (v, d = 2) => {
    if (v === null || v === undefined || isNaN(v)) return '<span class="muted">—</span>';
    const cls = v > 0.0001 ? "pos" : v < -0.0001 ? "neg" : "neu";
    const ic = v > 0.0001 ? "▲" : v < -0.0001 ? "▼" : "■";
    return `<span class="${cls}"><span aria-hidden="true">${ic}</span> ${v > 0 ? "+" : ""}${num(v, d)}%</span>`;
  };
  const data = (s) => { if (!s) return "—"; const [y, m, d] = s.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
  const dataCurta = (s) => { const [, m, d] = s.split("-"); return `${d} ${MESES[+m - 1]}`; };
  const mesAno = (s) => { const [y, m] = s.split("-"); return `${MESES[+m - 1]}/${y.slice(2)}`; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => encodeURIComponent(s);

  const normaliza = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const rotuloClasse = (c) => ({ "Renda variavel": "Renda variável", "Renda fixa": "Renda fixa", "Tesouro Direto": "Tesouro Direto", Fundos: "Fundos" }[c] || c);
  const rotuloTipo = (t) => ({ Acoes: "Ações", FII: "FIIs", ETF: "ETFs", "Titulo publico": "Título público", CDB: "CDB", LCA: "LCA", LCI: "LCI", Debenture: "Debênture", "Fundo de investimento": "Fundo de investimento" }[t] || t);
  const rotuloMov = (m) => ({ Negociacao: "Negociação", Aplicacao: "Aplicação", Resgate: "Resgate" }[m] || m);
  const rotuloProv = (p) => ({ "Juros sobre capital proprio": "JCP", Dividendo: "Dividendo", Rendimento: "Rendimento" }[p] || p);

  function downloadCSV(nome, linhas) {
    const csv = "﻿" + linhas.map((l) => l.map((c) => { const s = String(c ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function toast(msg) {
    const t = document.getElementById("toast"); if (!t) return;
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // Botão "i" que abre explicação de metodologia/origem do dado
  const info = (texto, rotulo = "Como calculamos") => `<button class="info" type="button" data-info="${esc(texto)}" aria-label="${esc(rotulo)}: ${esc(texto)}">i</button>`;

  return { state, store, brl, num, qtd, pct, sinal, data, dataCurta, mesAno, esc, slug, normaliza, rotuloClasse, rotuloTipo, rotuloMov, rotuloProv, downloadCSV, toast, info, MESES };
})();

window.MERCADO = (function () {
  const D = window.B3DATA, C = window.CATALOGO;
  const BASE = D.dataBase; // 2026-11-23
  const ATUALIZACAO = BASE + "T18:05:00"; // horário de fechamento simulado

  function rng(seedStr) {
    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
      return ((h ^= h >>> 16) >>> 0) / 4294967296;
    };
  }
  const gauss = (r) => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  const toD = (s) => new Date(s + "T12:00:00");
  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return iso(d); };
  const isBiz = (s) => { const w = toD(s).getDay(); return w !== 0 && w !== 6; };
  const nextBiz = (s, n = 1) => { let d = s; let k = 0; while (k < n) { d = addDays(d, 1); if (isBiz(d)) k++; } return d; };
  const prevBiz = (s) => { let d = s; while (!isBiz(d)) d = addDays(d, -1); return d; };
  const lastBizOfMonth = (y, m) => prevBiz(iso(new Date(Date.UTC(y, m + 1, 0, 12))));

  // dias úteis dos últimos ~12 meses até a data-base
  const dias = [];
  { let d = BASE; while (dias.length < 252) { if (isBiz(d)) dias.unshift(d); d = addDays(d, -1); } }

  // preço de referência = média dos preços da amostra
  const somas = {};
  Object.values(D.investidores).forEach((inv) => inv.ativos.forEach(([a, , , , p]) => { (somas[a] = somas[a] || []).push(p); }));
  const precoRef = {}; Object.entries(somas).forEach(([a, arr]) => { precoRef[a] = arr.reduce((x, y) => x + y, 0) / arr.length; });

  const vol = { acao: 0.019, fii: 0.008, etf: 0.012, tesouro: 0.002 };
  const drift = { acao: 0.0004, fii: 0.0002, etf: 0.0004, tesouro: 0.0005 };

  function serie(ticker, fim, tipo) {
    const r = rng("px:" + ticker);
    const out = new Array(dias.length); out[dias.length - 1] = fim;
    for (let i = dias.length - 2; i >= 0; i--) {
      const ret = drift[tipo] + vol[tipo] * gauss(r);
      out[i] = out[i + 1] / (1 + ret);
    }
    return dias.map((d, i) => [d, +out[i].toFixed(2)]);

  const cotacoes = {};

    const r = rng("vol:" + tk);
    const ultimo = s[s.length - 1][1], ant = s[s.length - 2][1];

    const ini12 = s[0][1];
    const volumeMi = meta.tipo === "tesouro" ? null : +(meta.tipo === "acao" ? (meta.ind.vm || 20) * (0.9 + r() * 1.4) : 8 + r() * 40).toFixed(1);
    cotacoes[tk] = {
      ticker: tk, serie: s, ultimo, anterior: ant, var: (ultimo / ant - 1) * 100,
      max: +(ultimo * (1 + r() * 0.012)).toFixed(2), min: +(ultimo * (1 - r() * 0.012)).toFixed(2),
      abertura: +(ant * (1 + (r() - 0.5) * 0.01)).toFixed(2),

/* Gráficos em SVG puro: linha (multi-séries, tooltip), rosca e barras empilhadas.
 * Cada gráfico tem tabela equivalente acessível (gerada pelas views).
 */
window.CH = (function () {
  const NS = "http://www.w3.org/2000/svg";
  let uid = 0;

  function niceTicks(min, max, n = 4) {
    if (min === max) { min -= 1; max += 1; }
    const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
    return out;
  }

  /** opts: { series:[{nome, cor, pontos:[[x(label), y]], tracejado}], fmtY, fmtX, altura, area, base100 } */
  function linha(el, opts) {
    const W = el.clientWidth || 640, H = opts.altura || 240, P = { l: 64, r: 16, t: 14, b: 28 };
    const series = opts.series.filter((s) => s.pontos.length);
    const n = series[0].pontos.length;
    const ys = series.flatMap((s) => s.pontos.map((p) => p[1]));
    const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, n - 1);
    const Y = (v) => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
    const fmtY = opts.fmtY || ((v) => v);
    const fmtX = opts.fmtX || ((v) => v);
    const id = "g" + ++uid;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${opts.label || "Gráfico de linha"}">`;
    s += `<defs>${series.map((se, k) => `<linearGradient id="${id}a${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${se.cor}" stop-opacity=".18"/><stop offset="1" stop-color="${se.cor}" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
    ticks.forEach((t) => { s += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${P.l - 8}" y="${Y(t) + 4}" class="axis" text-anchor="end">${fmtY(t, true)}</text>`; });
    const passos = Math.max(1, Math.ceil(n / (W < 480 ? 4 : 7)));
    series[0].pontos.forEach((p, i) => { if (i % passos === 0 || i === n - 1) s += `<text x="${X(i)}" y="${H - 8}" class="axis" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${fmtX(p[0])}</text>`; });
    series.forEach((se, k) => {
      const d = se.pontos.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
      if (opts.area && k === 0) s += `<path d="${d}L${X(n - 1)},${Y(y0)}L${X(0)},${Y(y0)}Z" fill="url(#${id}a${k})"/>`;
      s += `<path d="${d}" fill="none" stroke="${se.cor}" stroke-width="${k === 0 ? 2.4 : 1.8}" ${se.tracejado ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    s += `<line class="cursor" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" style="display:none"/>`;
    series.forEach((se, k) => { s += `<circle class="dot" data-k="${k}" r="4" fill="${se.cor}" stroke="#fff" stroke-width="2" style="display:none"/>`; });
    s += `<rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" class="hit"/></svg>`;
    el.innerHTML = s + `<div class="tip" role="status" aria-live="polite"></div>`;
    if (series.length > 1 || opts.legenda) {
      el.insertAdjacentHTML("afterbegin", `<div class="legend">${series.map((se) => `<span><i style="background:${se.cor}${se.tracejado ? ";background:repeating-linear-gradient(90deg," + se.cor + " 0 5px,transparent 5px 8px)" : ""}"></i>${se.nome}</span>`).join("")}</div>`);
    }
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = svg.querySelector(".cursor"), dots = svg.querySelectorAll(".dot");
    function show(i) {
      cur.setAttribute("x1", X(i)); cur.setAttribute("x2", X(i)); cur.style.display = "";
      dots.forEach((d) => { const se = series[+d.dataset.k]; d.setAttribute("cx", X(i)); d.setAttribute("cy", Y(se.pontos[i][1])); d.style.display = ""; });
      tip.innerHTML = `<b>${fmtX(series[0].pontos[i][0], true)}</b>` + series.map((se) => `<div><i style="background:${se.cor}"></i>${se.nome}: <b>${fmtY(se.pontos[i][1])}</b></div>`).join("");
      tip.style.display = "block";
      const rect = svg.getBoundingClientRect(), sx = rect.width / W;
      const left = X(i) * sx; tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), rect.width - tip.offsetWidth) + "px";
      tip.style.top = (el.querySelector(".legend") ? 28 : 0) + "px";
    }
    function hide() { cur.style.display = "none"; dots.forEach((d) => (d.style.display = "none")); tip.style.display = "none"; }
    const hit = svg.querySelector(".hit");
    hit.addEventListener("mousemove", (e) => {
      const rect = svg.getBoundingClientRect(), x = ((e.clientX - rect.left) * W) / rect.width;
      show(Math.max(0, Math.min(n - 1, Math.round(((x - P.l) / (W - P.l - P.r)) * (n - 1)))));
    });
    hit.addEventListener("mouseleave", hide);
    svg.setAttribute("tabindex", "0");
    let ki = n - 1;
    svg.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { ki = Math.max(0, ki - 1); show(ki); e.preventDefault(); } if (e.key === "ArrowRight") { ki = Math.min(n - 1, ki + 1); show(ki); e.preventDefault(); } });
    svg.addEventListener("blur", hide);
  }

  /** segs: [{nome, valor, cor}] */
  function rosca(el, segs, opts = {}) {
    const total = segs.reduce((a, s) => a + s.valor, 0) || 1, R = 70, r = 46, C = 90;
    let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="${opts.label || "Distribuição"}">`;
    segs.forEach((sg) => {
      const a1 = a0 + (sg.valor / total) * Math.PI * 2 - (segs.length > 1 ? 0.012 : 0);
      const large = a1 - a0 > Math.PI ? 1 : 0, p = (ang, rad) => `${C + rad * Math.cos(ang)},${C + rad * Math.sin(ang)}`;
      if (segs.length === 1) s += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${sg.cor}" stroke-width="${R - r}"/>`;
      else s += `<path d="M${p(a0, R)}A${R},${R} 0 ${large} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${large} 0 ${p(a0, r)}Z" fill="${sg.cor}"><title>${sg.nome}: ${((sg.valor / total) * 100).toFixed(1)}%</title></path>`;
      a0 = a1 + (segs.length > 1 ? 0.012 : 0);
    });
    s += `<text x="${C}" y="${C - 4}" text-anchor="middle" class="donut-n">${opts.centro || ""}</text><text x="${C}" y="${C + 14}" text-anchor="middle" class="axis">${opts.sub || ""}</text></svg>`;
    el.innerHTML = s;
  }

  /** grupos: [{rotulo, valores:[v1, v2]}], series:[{nome, cor}] — barras empilhadas */
  function barras(el, grupos, series, opts = {}) {
    const W = el.clientWidth || 640, H = opts.altura || 200, P = { l: 56, r: 8, t: 10, b: 26 };
    const tot = grupos.map((g) => g.valores.reduce((a, b) => a + b, 0));
    const ticks = niceTicks(0, Math.max(...tot, 1), 3);
    const y1 = ticks[ticks.length - 1];
    const bw = ((W - P.l - P.r) / grupos.length) * 0.62;
    const X = (i) => P.l + ((i + 0.5) * (W - P.l - P.r)) / grupos.length;
    const Y = (v) => P.t + (1 - v / y1) * (H - P.t - P.b);
    const fmtY = opts.fmtY || ((v) => v);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${opts.label || "Gráfico de barras"}">`;
    ticks.forEach((t) => { s += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${P.l - 8}" y="${Y(t) + 4}" class="axis" text-anchor="end">${fmtY(t, true)}</text>`; });
    grupos.forEach((g, i) => {
      let acc = 0;
      g.valores.forEach((v, k) => {
        if (v <= 0) return;
        const yTop = Y(acc + v), h = Y(acc) - yTop;
        s += `<rect x="${X(i) - bw / 2}" y="${yTop}" width="${bw}" height="${Math.max(0, h - 1)}" rx="3" fill="${series[k].cor}" ${series[k].hachura ? `fill-opacity=".45" stroke="${series[k].cor}" stroke-dasharray="3 2"` : ""}><title>${g.rotulo} · ${series[k].nome}: ${fmtY(v)}</title></rect>`;
        acc += v;
      });
      s += `<text x="${X(i)}" y="${H - 8}" class="axis" text-anchor="middle">${g.rotulo}</text>`;
    });
    s += "</svg>";
    el.innerHTML = (series.length > 1 ? `<div class="legend">${series.map((se) => `<span><i style="background:${se.cor};${se.hachura ? "opacity:.5" : ""}"></i>${se.nome}</span>`).join("")}</div>` : "") + s;
  }

  /** mini sparkline inline */
  function spark(pontos, cor, w = 96, h = 28) {
    const min = Math.min(...pontos), max = Math.max(...pontos), n = pontos.length;
    const d = pontos.map((v, i) => `${i ? "L" : "M"}${((i * w) / (n - 1)).toFixed(1)},${(h - 2 - ((v - min) / (max - min || 1)) * (h - 4)).toFixed(1)}`).join("");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${cor}" stroke-width="1.6"/></svg>`;
  }

  return { linha, rosca, barras, spark };
})();

/* Cálculos da carteira de um investidor a partir da amostra. Toda métrica expõe sua metodologia. */
window.CART = (function () {
  const D = window.B3DATA, M = window.MERCADO, C = window.CATALOGO;

    const inv = D.investidores[id];
    const total = soma(inv.classes, (c) => c[4]);
    const agrupa = (idx) => { const o = {}; inv.classes.forEach((c) => (o[c[idx]] = (o[c[idx]] || 0) + c[4])); return Object.entries(o).map(([k, v]) => ({ nome: k, valor: v, pct: (v / total) * 100 })).sort((a, b) => b.valor - a.valor); };
    const porClasse = agrupa(1).map((x) => Object.assign(x, { cor: CORES_HEX[x.nome] || "#888" }));
    const porInst = agrupa(0).map((x, i) => Object.assign(x, { cor: PALETA[i % PALETA.length] }));
    const porTipo = (() => { const o = {}; inv.classes.forEach((c) => { const k = c[1] + "|" + c[2]; o[k] = o[k] || { classe: c[1], tipo: c[2], valor: 0, qtd: 0, inst: new Set() }; o[k].valor += c[4]; o[k].qtd += c[3]; o[k].inst.add(c[0]); }); return Object.values(o).sort((a, b) => b.valor - a.valor); })();

    // Posições por ativo (renda variável e Tesouro) com cotação simulada do dia
    const ativos = inv.ativos.map(([tk, classe, tipo, q, p, v]) => {
      const cot = M.cotacoes[tk];
      return { tk, classe, tipo, q, preco: p, valor: v, pct: (v / total) * 100, var: cot ? cot.var : null, var12m: cot ? cot.var12m : null, meta: C.ativos[tk] || {} };
    }).sort((a, b) => b.valor - a.valor);

    const evol = inv.evol; // [data, patrimonio]
    const ini = evol[0][1], fim = evol[evol.length - 1][1];
    const dataIni = evol[0][0];
    const movs12 = inv.mov.filter((m) => m[0] > dataIni);
    const entradas = soma(movs12.filter((m) => m[3] === "Compra"), (m) => m[7]);
    const saidas = soma(movs12.filter((m) => m[3] === "Venda"), (m) => m[7]);
    const aportesLiq = entradas - saidas;
    const variacao = fim - ini;
    const resultado = variacao - aportesLiq;

    // Rentabilidade mensal (Modified Dietz simplificado: fluxos no meio do mês)
    const fluxoMes = {};
    inv.mov.forEach((m) => { const k = ym(m[0]); fluxoMes[k] = (fluxoMes[k] || 0) + (m[3] === "Compra" ? m[7] : -m[7]); });
    const rent = [[evol[0][0], 0]], cdi = [[evol[0][0], 0]];
    let acc = 1, accCdi = 1;
    for (let i = 1; i < evol.length; i++) {
      const v0 = evol[i - 1][1], v1 = evol[i][1];
      const k = ym(evol[i][0]);
      const f = i === evol.length - 1 && ym(evol[i][0]) === ym(evol[i - 1][0]) ? 0 : fluxoMes[k] || 0;
      let r = (v1 - v0 - f) / (v0 + 0.5 * f || 1);
      r = Math.max(-0.35, Math.min(0.35, r));
      acc *= 1 + r; accCdi *= 1 + (M.cdiMensal[i - 1] || 1) / 100;

    const ibov = evol.map(([d]) => { const p = ibovS.filter((x) => x[0] <= d).pop() || ibovS[0]; return [d, (p[1] / ibovS.find((x) => x[0] >= dataIni)[1] - 1) * 100]; });

    // Proventos
    const prov = inv.prov.map(([data, classe, tipo, tk, tp, valor, recebido]) => ({ data, classe, tipo, tk, tp, valor, recebido }));
    const recebidos12 = prov.filter((p) => p.recebido && p.data > dataIni);
    const anunciados = prov.filter((p) => !p.recebido);

    // Instituições: status de atualização simulado (um caso "aguardando origem" quando há 3+ instituições)
    const insts = porInst.map((x) => x.nome).sort();
    const pend = insts.length >= 3 ? insts[hash(id) % insts.length] : null;
    const conexoes = insts.map((n) => ({ nome: n, valor: porInst.find((x) => x.nome === n).valor, status: n === pend ? "aguardando" : "ok", posicao: n === pend ? "2026-11-19" : D.dataBase }));

    const r = { id, inv, total, porClasse, porInst, porTipo, ativos, evol, ini, fim, variacao, aportesLiq, entradas, saidas, resultado, rent, cdi, ibov, prov, recebidos12, anunciados, conexoes, pendInst: pend, dataIni };
    cache[id] = r;

  }

  function temasCarteira(r) {
    const t = new Set();
    r.porTipo.forEach((p) => {
      if (p.tipo === "Acoes") t.add("acoes"); if (p.tipo === "FII") t.add("fii"); if (p.tipo === "ETF") t.add("etf");
      if (p.tipo === "Titulo publico") t.add("tesouro"); if (p.classe === "Renda fixa") t.add("renda fixa");

  return { resumo, temasCarteira, perfilInferido, CORES_CLASSE, CORES_HEX, PALETA };
})();

    if (top && top.pct > 35) {
      itens.push({ id: "d-conc", grupo: "carteira", esfera: "edu", formato: "Para refletir", titulo: `${top.tk} representa ${U.num(top.pct, 1)}% do seu patrimônio na B3`,
        resumo: "Concentração alta aumenta o impacto de um único ativo no seu resultado. Veja um conteúdo sobre diversificação — isto não é uma recomendação de compra ou venda.",
        url: C.esferas.edu.url, cta: "Aprender sobre diversificação", externo: true, motivos: ["Concentração na sua carteira"], score: 90 });
    }
    if (r.pendInst) {
      itens.push({ id: "d-conexao", grupo: "carteira", esfera: "area", formato: "Pendência", titulo: `${r.pendInst} ainda não atualizou sua posição`,
        resumo: "Seu consolidado pode estar incompleto. Veja a data da última posição, o motivo provável e quem resolve.", url: "#/conexoes", cta: "Ver detalhes", motivos: ["Afeta o seu total"], score: 92 });
    }
    const ag = M.eventos.filter((e) => e.categoria === "Assembleia" && held.has(e.ticker) && e.data >= hoje);
    if (ag.length) {
      itens.push({ id: "d-ag-" + ag[0].ticker, grupo: "eventos", esfera: "assembleias", formato: "Assembleia", titulo: `Assembleia de ${ag[0].ticker} em ${U.data(ag[0].data)}`,
        resumo: "Você pode votar a distância nas decisões da empresa, sem sair da Área do Investidor.", url: "#/assembleias", cta: "Ver pauta e votar", motivos: [`Você tem ${ag[0].ticker}`], score: 70 });
    }
    // Card de mercado (curto, sem estímulo a negociar)
    const ib = M.indices.IBOV;
    itens.push({ id: "d-mercado", grupo: "eventos", esfera: "area", formato: "Mercado hoje", titulo: `Ibovespa fechou em ${U.num(ib.ultimo, 0)} pontos (${ib.var >= 0 ? "+" : ""}${U.num(ib.var, 2)}%)`,
      resumo: "Veja maiores altas, baixas e mais negociadas, com o horário e o atraso de cada dado.", url: "#/mercado", cta: "Abrir Mercado hoje", motivos: ["Resumo diário"], score: 40 });
    if (pf.perfil !== "con") {
      itens.push({ id: "d-ofertas", grupo: "eventos", esfera: "ofertas", formato: "Ofertas públicas", titulo: `${M.ofertas.length} ofertas públicas com cronograma divulgado`,
        resumo: "Prospectos, período de reserva e público-alvo em um só lugar. Leia o prospecto antes de decidir.", url: "#/ofertas", cta: "Ver ofertas", motivos: [`Perfil ${C.perfis[pf.perfil].nome}`], score: 45 });
    }

    // ---------- Conteúdo educativo das esferas B3 ----------
    const conteudo = C.conteudos.map((c) => {
      let s = 0; const mot = [];
      if (c.perfis.includes(pf.perfil)) { s += 4; mot.push(`Perfil ${C.perfis[pf.perfil].nome}${pf.origem === "inferido" ? " (inferido da carteira)" : ""}`); }
      if (pf.nivel && c.nivel.includes(pf.nivel)) { s += 2; mot.push(`Nível ${C.niveis[pf.nivel]}`); }
      const ints = c.temas.filter((t) => (pf.interesses || []).includes(t));
      if (ints.length) { s += 4 + (ints.length - 1); mot.push("Seu interesse em " + ints.map(nomeTema).join(", ")); }
      const cart = c.temas.filter((t) => temasCart.has(t));
      if (cart.length) { s += (pf.interesses || []).length ? 1 : 2; mot.push("Você investe em " + cart.map(nomeTema).join(", ")); }
      if (!c.perfis.includes(pf.perfil)) s -= 3;
      return Object.assign({}, c, { grupo: "aprender", motivos: mot, score: s, externo: c.url.startsWith("http"), cta: ctaPorFormato(c.formato) });
    }).filter((c) => c.score > 0 && !ocultos.has(c.id)).sort((a, b) => b.score - a.score).slice(0, LIMITE_CONTEUDO);

    // Intercala: 2 cards dinâmicos de maior prioridade, depois alterna conteúdo e eventos
    const dinamicos = itens.filter((i) => !ocultos.has(i.id)).sort((a, b) => b.score - a.score);
    const out = dinamicos.slice(0, 2);
    let di = 2, ci = 0;
    while (di < dinamicos.length || ci < conteudo.length) {
      for (let k = 0; k < 2 && ci < conteudo.length; k++) out.push(conteudo[ci++]);
      if (di < dinamicos.length) out.push(dinamicos[di++]);
    }
    out.forEach((i) => (i.salvo = salvos.has(i.id)));
    return { perfil: pf, itens: out, ocultosCount: ocultos.size };
  }

  function nomeTema(t) {
    return { "renda fixa": "renda fixa", tesouro: "Tesouro Direto", dividendos: "dividendos", fii: "FIIs", acoes: "ações", etf: "ETFs", internacional: "internacional", derivativos: "derivativos", ir: "IR", planejamento: "planejamento" }[t] || t;
  }
  function ctaPorFormato(f) { return { Curso: "Fazer o curso", Artigo: "Ler artigo", Vídeo: "Assistir", Podcast: "Ouvir", Guia: "Abrir guia", Simulador: "Simular", Serviço: "Acessar", Notícia: "Ler notícia" }[f] || "Abrir"; }

  function ocultar(id, itemId) { const s = new Set(U.store.get("feed:ocultos:" + id, [])); s.add(itemId); U.store.set("feed:ocultos:" + id, [...s]); }
  function alternarSalvo(id, itemId) { const s = new Set(U.store.get("feed:salvos:" + id, [])); s.has(itemId) ? s.delete(itemId) : s.add(itemId); U.store.set("feed:salvos:" + id, [...s]); return s.has(itemId); }
  function restaurar(id) { U.store.set("feed:ocultos:" + id, []); }

  function calcularPerfil(respostas) {
    let pts = 0, max = 0;
    C.questionario.forEach((q) => {
      if (q.nivel || q.interesses) return;
      const r = respostas[q.id];
      if (q.tipo === "multi") { max += 3; pts += r && r.length ? Math.max(...r.map((i) => q.opcoes[i].p)) : 0; }
      else { max += 3; pts += r !== undefined ? q.opcoes[r].p : 0; }
    });
    // trava de adequação: sem reserva de emergência ou prazo < 1 ano limita a Moderado/Conservador
    let perfil = pts <= 6 ? "con" : pts <= 12 ? "mod" : "arr";
    const travas = [];
    if (respostas.prazo === 0 && perfil !== "con") { perfil = "con"; travas.push("Prazo menor que 1 ano limita o perfil a Conservador."); }
    if (respostas.reserva === 0 && perfil === "arr") { perfil = "mod"; travas.push("Sem reserva de emergência, o perfil fica limitado a Moderado."); }
    const qn = C.questionario.find((q) => q.nivel);
    const nivel = respostas.conhecimento !== undefined ? qn.opcoes[respostas.conhecimento].v : "ini";
    const qi = C.questionario.find((q) => q.interesses);
    const interesses = (respostas.interesses || []).map((i) => qi.opcoes[i].v);
    return { perfil, nivel, interesses, pontos: pts, max, travas };
  }

  return { montar, perfilDe, ocultar, alternarSalvo, restaurar, calcularPerfil, nomeTema };
})();

</script>
  <script>/* js/views-carteira.js */

            </tbody><tfoot><tr><td colspan="4">Total filtrado</td><td class="num">${U.brl(tot)}</td><td class="num">${U.num((tot / r.total) * 100, 1)}%</td><td colspan="3"></td></tr></tfoot></table></div>` : `<div class="empty"><div class="big">🔎</div>Nenhum ativo com esses filtros. <a href="#" id="limpar">Limpar filtros</a></div>`;
          el._rows = [["Ativo", "Nome", "Classe", "Tipo", "Quantidade", "Preço", "Valor"]].concat(rows.map((a) => [a.tk, a.meta.nome || "", U.rotuloClasse(a.classe), U.rotuloTipo(a.tipo), a.q, a.preco, a.valor]));
        } else {

          const tot = rows.reduce((s, c) => s + c[4], 0);

  // =============== FICHA DO ATIVO ===============

    return cel("Indexador", i.indexador) + cel("Taxa de referência", i.taxa) + cel("Vencimento", U.data(i.vencimento)) + cel("Preço unitário", "R$ " + U.num(cot.ultimo, 2));

  V.ativo = {

        <div><div class="price">R$ ${U.num(cot.ultimo, 2)}</div><div style="text-align:right">${U.sinal(cot.var)} <span class="muted small">hoje</span></div><div class="small muted" style="text-align:right;margin-top:4px">Abertura ${U.num(cot.abertura, 2)} · Mín ${U.num(cot.min, 2)} · Máx ${U.num(cot.max, 2)}</div><div style="text-align:right;margin-top:6px">${stamp()}</div></div>
      </div></div>
      ${pos ? `<div class="alert info-a section"><span class="ic">📌</span><div><b>Você tem ${U.qtd(pos.q)} ${meta.tipo === "tesouro" ? "títulos" : meta.tipo === "fii" || meta.tipo === "etf" ? "cotas" : "ações"} · ${U.brl(pos.valor)}</b><p>${U.num(pos.pct, 1)}% do seu patrimônio na B3${meusProv.length ? ` · ${U.brl(meusProv.filter((p) => p.recebido).reduce((a, p) => a + p.valor, 0))} recebidos em proventos (12m)` : ""}. Isto é a sua posição — acompanhar é separado.</p></div></div>` : ""}

          ${prox.length ? prox.slice(0, 1).map((p) => `<div class="stack"><div><span class="chip ${p.status === "Confirmado" ? "ok" : "warn"}">${p.status}</span> <b>${p.tipo}</b> · R$ ${U.num(p.valor, p.valor < 1 ? 4 : 2)} por ${meta.tipo === "fii" ? "cota" : "ação"}</div>
            <div class="list-item"><div class="date-box"><b>${p.dataCom.slice(8)}</b><span>${U.MESES[+p.dataCom.slice(5, 7) - 1]}</span></div><div class="grow"><div class="t">Data-com</div><div class="s">Último dia para comprar e ter direito</div></div></div>
            <div class="list-item"><div class="date-box"><b>${p.dataEx.slice(8)}</b><span>${U.MESES[+p.dataEx.slice(5, 7) - 1]}</span></div><div class="grow"><div class="t">Data ex</div><div class="s">Negocia sem direito ao provento</div></div></div>
            <div class="list-item"><div class="date-box"><b>${p.pagamento.slice(8)}</b><span>${U.MESES[+p.pagamento.slice(5, 7) - 1]}</span></div><div class="grow"><div class="t">Pagamento</div><div class="s">${p.status === "Previsto" ? "Data estimada pelo histórico" : "Data confirmada pela empresa"}</div></div></div></div>`).join("")
            : `<div class="muted">${meta.tipo === "etf" || meta.tipo === "tesouro" ? "Este ativo não distribui proventos." : "Nenhum provento anunciado no momento."}</div>`}
        </div>
      </div>
      <div class="card section"><div class="card-h"><div><h2>Indicadores</h2><div class="sub">Clique em “i” para entender cada indicador · dados ilustrativos</div></div></div><div class="ind-grid">${indicadores(tk, meta, cot)}</div></div>
      ${provs.length ? `<div class="grid g2 section"><div class="card"><div class="card-h"><div><h2>Proventos por ano</h2><div class="sub">R$ por ${meta.tipo === "fii" ? "cota" : "ação"}</div></div></div><div class="chart" id="chAnual"></div></div>
        <div class="card"><div class="card-h"><h2>Histórico de proventos</h2></div><div class="tbl-wrap" style="max-height:280px;overflow-y:auto"><table><thead><tr><th>Tipo</th><th>Data-com</th><th>Pagamento</th><th class="num">Valor</th></tr></thead><tbody>${provs.slice().reverse().map((p) => `<tr><td>${p.tipo}</td><td>${U.data(p.dataCom)}</td><td>${U.data(p.pagamento)}</td><td class="num">R$ ${U.num(p.valor, p.valor < 1 ? 4 : 2)}</td></tr>`).join("")}</tbody></table></div></div></div>` : ""}
      <div class="section"><h2 style="margin-bottom:12px">Aprenda sobre ${tipoNome.toLowerCase()}s com a B3</h2><div class="grid g3">${cont.map((c) => V._feedCard(Object.assign({}, c, { motivos: ["Relacionado a " + tk], externo: c.url.startsWith("http"), cta: "Abrir" }), true)).join("")}</div></div>`;

      document.getElementById("watchBtn").addEventListener("click", (e) => {
        const w = getWatch(id), on = !w.includes(tk);

  };

  // =============== CALENDÁRIO ===============
  V.calendario = {
    html({ r }) {
      return `<div class="page-head"><div><div class="crumb">Mercado</div><h1>Calendário de eventos</h1><p>Proventos, resultados e assembleias — previsto e confirmado sempre identificados</p></div></div>
      <div class="grid g3" style="margin-bottom:16px">

      </div>
      <div class="card"><div class="filters">
        <label>Período<select id="cPer"><option value="30">Próximos 30 dias</option><option value="75">Próximos 75 dias</option><option value="-20">Últimos 20 dias</option></select></label>
        <label>Evento<select id="cTipo"><option value="">Todos</option><option>Data-com</option><option>Data ex</option><option>Pagamento</option><option value="Resultado">Resultados</option><option value="Assembleia">Assembleias</option></select></label>
        <label>Empresa / ativo<select id="cAtivo"><option value="">Todos</option>${RV.filter((t) => C.ativos[t].tipo !== "etf").map((t) => `<option>${t}</option>`).join("")}</select></label>
        <label style="flex-direction:row;align-items:center;gap:6px;margin-top:18px;color:var(--ink)"><input type="checkbox" id="cMeus" style="min-width:0;height:auto"> Só meus ativos</label>
        <label style="flex-direction:row;align-items:center;gap:6px;margin-top:18px;color:var(--ink)"><input type="checkbox" id="cWatch" style="min-width:0;height:auto"> Só acompanhados</label>
      </div><div id="calList"></div></div>`;
    },
    after({ r, id }) {
      const held = new Set(r.ativos.map((a) => a.tk));
      const draw = () => {
        const per = +document.getElementById("cPer").value, tipo = document.getElementById("cTipo").value, at = document.getElementById("cAtivo").value;
        const meus = document.getElementById("cMeus").checked, wl = document.getElementById("cWatch").checked, w = new Set(getWatch(id));
        const ini = per > 0 ? M.BASE : M.addDays(M.BASE, per), fim = per > 0 ? M.addDays(M.BASE, per) : M.addDays(M.BASE, -1);
        const evs = M.eventos.filter((e) => e.data >= ini && e.data <= fim && (!tipo || e.tipo === tipo || e.categoria === tipo) && (!at || e.ticker === at) && (!meus || held.has(e.ticker)) && (!wl || w.has(e.ticker)));

  // =============== COMPARAR ===============

        <div class="onb-nav"><button class="btn" data-nav="prev" ${slide === 0 ? "style=\"visibility:hidden\"" : ""}>← Voltar</button><button class="btn primary" data-nav="next">${slide === 0 ? "Começar →" : "Próximo →"}</button></div>
      </div></div>`;
    },
    after({ rerender }) {
      const ir = (n) => { slide = Math.max(0, Math.min(SLIDES.length, n)); rerender(); };
      document.querySelectorAll("[data-nav]").forEach((b) => b.addEventListener("click", () => ir(slide + (b.dataset.nav === "next" ? 1 : -1))));
      document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => ir(+b.dataset.go)));
      document.querySelectorAll("[data-fim]").forEach((b) => b.addEventListener("click", (e) => {
        U.store.set("onb:visto", true); slide = 0;
        const f = b.dataset.fim;
        if (f === "tutoriais") return;
        e.preventDefault();
        if (f === "perfil") location.hash = "#/perfil";
        else if (f === "tour") { location.hash = "#/visao-geral"; setTimeout(() => TOUR.iniciar("primeiros-passos"), 200); }
        else location.hash = "#/visao-geral";
        if (f === "pular") U.toast("Você pode rever a introdução em Tutoriais e ajuda");
      }));
      const onKey = (e) => { if (!document.querySelector(".onb")) return document.removeEventListener("keydown", onKey); if (e.key === "ArrowRight") ir(slide + 1); if (e.key === "ArrowLeft") ir(slide - 1); };
      document.addEventListener("keydown", onKey);
    },
  };

  // ======================================================================
  // Página Tutoriais e ajuda
  // ======================================================================
  V.tutoriais = {
    html({ params }) {
      const f = feitos(), cat = params[0] || "";
      const cats = [...new Set(TUTORIAIS.map((t) => t.cat))];
      const lista = TUTORIAIS.filter((t) => !cat || t.cat === cat);
      const pct = Math.round((f.size / TUTORIAIS.length) * 100);
      return `<div class="page-head"><div><div class="crumb">Para você</div><h1>Tutoriais e ajuda</h1><p>Tours guiados pela tela de verdade, passo a passo para ler com calma e respostas para as dúvidas mais comuns</p></div>
        <a class="btn" href="#/boas-vindas">↺ Rever boas-vindas</a></div>
      <div class="card tut-progress"><div><b>${f.size} de ${TUTORIAIS.length} tutoriais concluídos</b><div class="small muted">${f.size === TUTORIAIS.length ? "Você conhece tudo por aqui! 🎉" : "Comece por “Primeiros passos” se é sua primeira vez."}</div></div><div class="bar" style="flex:1;max-width:320px"><i style="width:${pct}%;background:var(--pos)"></i></div><span class="num"><b>${pct}%</b></span></div>
      <div class="filters" style="margin-top:16px"><div class="seg" role="group" aria-label="Categoria"><button aria-pressed="${!cat}" onclick="location.hash='#/tutoriais'">Todos</button>${cats.map((c) => `<button aria-pressed="${cat === c}" onclick="location.hash='#/tutoriais/${encodeURIComponent(c)}'">${c}</button>`).join("")}</div>
        <input id="tutBusca" type="search" placeholder="Buscar tutorial…" aria-label="Buscar tutorial" style="margin-left:auto"></div>
      <div class="grid g2" id="tutGrid">${lista.map((t) => `<article class="card tut" data-busca="${U.esc(U.normaliza(t.titulo + " " + t.desc + " " + t.passos.map((p) => p.titulo + " " + p.texto).join(" ")))}">
        <div class="tut-h"><span class="tut-ic" aria-hidden="true">${t.ic}</span><div class="grow"><div class="small muted">${t.cat} · ${t.passos.length} passos · ~${Math.max(1, Math.round(t.passos.length * 0.25))} min</div><h2>${t.titulo}</h2></div>${f.has(t.id) ? '<span class="chip ok">✓ Concluído</span>' : '<span class="chip blue">Novo</span>'}</div>
        <p class="small" style="color:var(--ink-2);margin:6px 0 12px">${t.desc}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" data-tour="${t.id}">▶ ${f.has(t.id) ? "Refazer tour" : "Iniciar tour guiado"}</button></div>
        <details class="tut-steps"><summary>Ler passo a passo</summary><ol>${t.passos.map((p) => `<li><b>${U.esc(p.titulo)}</b><br><span>${U.esc(p.texto)}</span> <a href="#/${p.rota}" class="small">Ir para a tela →</a></li>`).join("")}</ol></details>
      </article>`).join("")}</div>
      <div id="tutVazio" class="empty" hidden>Nenhum tutorial encontrado.</div>
      <div class="section"><h2 style="margin-bottom:12px">Perguntas frequentes</h2><div class="card faq">${FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div></div>
      <div class="card section" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span style="font-size:28px" aria-hidden="true">🎓</span><div class="grow" style="flex:1;min-width:200px"><h2>Quer ir além?</h2><p class="small muted" style="margin:4px 0 0">Cursos gratuitos sobre investimentos na B3 Educação e conteúdos diários no Bora Investir.</p></div><a class="btn" href="https://edu.b3.com.br/" target="_blank" rel="noopener">B3 Educação ↗</a><a class="btn" href="https://borainvestir.b3.com.br/" target="_blank" rel="noopener">Bora Investir ↗</a></div>`;
    },
    after() {
      document.querySelectorAll("[data-tour]").forEach((b) => b.addEventListener("click", () => TOUR.iniciar(b.dataset.tour)));
      const busca = document.getElementById("tutBusca");
      busca.addEventListener("input", () => {
        const q = U.normaliza(busca.value.trim()); let n = 0;
        document.querySelectorAll("#tutGrid .tut").forEach((c) => { const ok = !q || c.dataset.busca.includes(q); c.hidden = !ok; if (ok) n++; });
        document.getElementById("tutVazio").hidden = n > 0;
      });
    },
  };

  window.TUTORIAIS = TUTORIAIS;
})(window.VIEWS);

</script>
  <script>/* js/app.js */
/* Núcleo: navegação, rotas por hash, busca global, investidor de teste e ocultar valores. */
(function () {
  const D = window.B3DATA, C = window.CATALOGO, U = window.U, V = window.VIEWS;
  const DEFAULT_INV = "INV-035";

  const ic = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    feed: ic('<path d="M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z"/>'),
    home: ic('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    pie: ic('<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'),
    coin: ic('<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.2 0-2.2-.6-2.6-1.6M12 6v2m0 8v2"/>'),
    list: ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
    doc: ic('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
    link: ic('<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'),
    chart: ic('<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/>'),
    cal: ic('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
    star: ic('<path d="M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z"/>'),
    eye: ic('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
    cmp: ic('<path d="M8 3v18M16 3v18M3 8h5M16 16h5"/>'),
    user: ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
    rocket: ic('<path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2M9 11l4 4M14 4c3-1 6-1 6-1s0 3-1 6l-7 7-5-5z"/>'),
    vote: ic('<path d="M4 12l5 5L20 6"/>'),
  };

  const NAV = [
    { h: "Para você" },
    { r: "para-voce", t: "Feed personalizado", i: I.feed },
    { r: "perfil", t: "Perfil do investidor", i: I.user },
    { r: "tutoriais", t: "Tutoriais e ajuda", i: ic('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>'), novo: true },
    { h: "Meus investimentos" },
    { r: "visao-geral", t: "Visão geral", i: I.home },
    { r: "carteira", t: "Minha carteira", i: I.pie },
    { r: "recebimentos", t: "Recebimentos", i: I.coin },
    { r: "movimentacoes", t: "Movimentações", i: I.list },
    { r: "documentos", t: "Documentos e informes", i: I.doc },
    { r: "conexoes", t: "Conexões e dados", i: I.link, badge: true },
    { h: "Mercado" },
    { r: "mercado", t: "Mercado hoje", i: I.chart },
    { r: "calendario", t: "Calendário de eventos", i: I.cal },
    { r: "acompanhamento", t: "Lista de acompanhamento", i: I.eye },
    { r: "comparar", t: "Comparar ativos", i: I.cmp },
    { h: "Serviços B3" },
    { r: "ofertas", t: "Ofertas públicas", i: I.rocket },
    { r: "assembleias", t: "Assembleias", i: I.vote },
  ];

  let invId = U.store.get("inv", DEFAULT_INV);
  if (!D.investidores[invId]) invId = DEFAULT_INV;

  // ---------- Montagem fixa ----------
  const sel = document.getElementById("invSel");
  sel.innerHTML = Object.values(D.investidores).map((i) => `<option value="${i.id}">${i.id} · ${U.rotuloClasse(i.perfilCarteira)} · ${i.faixa.replace("Ate", "Até")}</option>`).join("");
  sel.value = invId;
  sel.addEventListener("change", () => { invId = sel.value; U.store.set("inv", invId); U.toast(`Investidor de teste: ${invId}`); render(); });

  const hideBtn = document.getElementById("hideBtn");
  const syncHide = () => { hideBtn.setAttribute("aria-pressed", String(U.state.hide)); hideBtn.querySelector("span").textContent = U.state.hide ? "Mostrar valores" : "Ocultar valores"; };
  hideBtn.addEventListener("click", () => { U.state.hide = !U.state.hide; syncHide(); render(); });
  syncHide();

  const menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", (e) => { e.stopPropagation(); const o = document.body.classList.toggle("nav-open"); menuBtn.setAttribute("aria-expanded", String(o)); });
  document.addEventListener("click", (e) => { if (document.body.classList.contains("nav-open") && !e.target.closest(".nav")) { document.body.classList.remove("nav-open"); menuBtn.setAttribute("aria-expanded", "false"); } });

  function renderNav(rota) {
    const r = window.CART.resumo(invId);
    document.getElementById("nav").innerHTML = NAV.map((n) => n.h ? `<h4>${n.h}</h4>` :
      `<a href="#/${n.r}" class="${rota === n.r ? "active" : ""}" ${rota === n.r ? 'aria-current="page"' : ""}>${n.i}<span>${n.t}</span>${n.badge && r.pendInst ? '<span class="badge" aria-label="1 pendência">1</span>' : ""}${n.novo && !U.store.get("tutoriais:feitos", []).length ? '<span class="chip blue" style="margin-left:auto;padding:1px 8px;font-size:11px">Novo</span>' : ""}</a>`).join("") +
      `<h4>Sobre o protótipo</h4><a href="#/sobre">${I.doc}<span>Benchmark e decisões</span></a>`;
    const pf = window.FEED.perfilDe(invId);
    const av = document.getElementById("avatar");
    av.textContent = invId.slice(-2);
    av.style.background = C.perfis[pf.perfil].cor;
    av.title = `Perfil ${C.perfis[pf.perfil].nome}${pf.origem === "inferido" ? " (inferido — responda o questionário)" : ""}`;
  }

  // ---------- Roteamento ----------
  function parse() {
    const h = location.hash.replace(/^#\/?/, "") || "para-voce";
    const [rota, ...rest] = h.split("/");
    return { rota, params: rest.map(decodeURIComponent) };
  }

  function render() {
    const { rota, params } = parse();
    const view = V[rota] || V["nao-encontrado"];
    renderNav(rota);
    document.body.classList.toggle("onb-mode", rota === "boas-vindas");
    const ctx = { id: invId, r: window.CART.resumo(invId), params, rerender: render };
    const app = document.getElementById("app");
    app.innerHTML = view.html(ctx);
    if (view.after) view.after(ctx, app);
    document.body.classList.remove("nav-open");
  }

  let ultimaRota = null;
  window.addEventListener("hashchange", () => {
    const { rota } = parse();
    render();
    if (rota !== ultimaRota) { window.scrollTo(0, 0); document.getElementById("app").focus({ preventScroll: true }); }
    ultimaRota = rota;
  });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });

  // ---------- Popover de metodologia ("i") ----------
  let pop = null;
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-info]");
    if (pop) { pop.remove(); pop = null; }
    if (!b) return;
    pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role", "tooltip"); pop.textContent = b.dataset.info;
    document.body.appendChild(pop);
    const r = b.getBoundingClientRect();
    pop.style.top = window.scrollY + r.bottom + 8 + "px";
    pop.style.left = Math.max(8, Math.min(window.scrollX + r.left - 20, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + "px";
    e.stopPropagation();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pop) { pop.remove(); pop = null; } });

  // ---------- Busca global ----------
  const q = document.getElementById("q"), sugg = document.getElementById("sugg");
  const paginas = NAV.filter((n) => n.r).map((n) => ({ t: n.t, url: "#/" + n.r, k: n.t }))
    .concat([{ t: "Proventos e dividendos", url: "#/recebimentos", k: "proventos dividendos jcp rendimentos" }, { t: "Informe de rendimentos (IR)", url: "#/documentos", k: "imposto de renda ir informe" }, { t: "Portabilidade", url: "#/conexoes", k: "portabilidade transferir" }, { t: "Questionário de perfil", url: "#/perfil", k: "suitability perfil questionario api" }]);
  let selIdx = -1, resultados = [];
  function buscar(txt) {
    const t = U.normaliza(txt.trim());
    if (!t) return [];
    const ativos = Object.entries(C.ativos).filter(([tk, m]) => U.normaliza(tk + " " + m.nome + " " + (m.empresa || "") + " " + m.setor).includes(t))
      .sort(([a], [b]) => (U.normaliza(a).startsWith(t) ? -1 : 0) - (U.normaliza(b).startsWith(t) ? -1 : 0)).slice(0, 6)
      .map(([tk, m]) => ({ html: `<span class="tk">${U.esc(tk)}</span><span class="grow">${U.esc(m.nome)}<br><small class="muted">${U.esc(m.setor)}</small></span>${window.CART.resumo(invId).ativos.some((a) => a.tk === tk) ? '<span class="chip blue">Na carteira</span>' : ""}`, url: "#/ativo/" + U.slug(tk) }));
    const pgs = paginas.filter((p) => U.normaliza(p.t + " " + p.k).includes(t)).slice(0, 3).map((p) => ({ html: `<span class="tk">Página</span><span>${U.esc(p.t)}</span>`, url: p.url }));
    return ativos.concat(pgs);
  }
  function desenha() {
    sugg.innerHTML = resultados.length ? resultados.map((r, i) => `<a href="${r.url}" role="option" aria-selected="${i === selIdx}">${r.html}</a>`).join("") + '<div class="hint">↑↓ para navegar · Enter para abrir · cotações com atraso de 15 min (simulado)</div>'
      : `<div class="hint">Nada encontrado para “${U.esc(q.value)}”. Tente o código (PETR4) ou o nome da empresa.</div>`;
    sugg.classList.toggle("open", !!q.value.trim());
  }
  q.addEventListener("input", () => { resultados = buscar(q.value); selIdx = resultados.length ? 0 : -1; desenha(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { selIdx = Math.min(resultados.length - 1, selIdx + 1); desenha(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { selIdx = Math.max(0, selIdx - 1); desenha(); e.preventDefault(); }
    else if (e.key === "Enter" && resultados[selIdx]) { location.hash = resultados[selIdx].url; fechar(); }
    else if (e.key === "Escape") fechar();
  });
  sugg.addEventListener("click", (e) => { if (e.target.closest("a")) fechar(); });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) sugg.classList.remove("open"); });
  function fechar() { q.value = ""; sugg.classList.remove("open"); q.blur(); }
  document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); q.focus(); } });

  // Primeiro acesso: mostra as boas-vindas antes de qualquer tela
  if (!U.store.get("onb:visto", false) && parse().rota !== "boas-vindas") history.replaceState(null, "", "#/boas-vindas");

  render();
  ultimaRota = parse().rota;
})();

</script>
